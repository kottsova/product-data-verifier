services:
  bot:
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in the shell environment}
      PRODUCT_VERIFIER_DB_PATH: /data/product-verifier.sqlite3
      PRODUCT_VERIFIER_MAX_CONCURRENT_JOBS: ${PRODUCT_VERIFIER_MAX_CONCURRENT_JOBS:-2}
      PRODUCT_VERIFIER_JOB_HISTORY_LIMIT: ${PRODUCT_VERIFIER_JOB_HISTORY_LIMIT:-20}
      PRODUCT_VERIFIER_CACHE_TTL_SECONDS: ${PRODUCT_VERIFIER_CACHE_TTL_SECONDS:-3600}
      PRODUCT_VERIFIER_LOG_LEVEL: ${PRODUCT_VERIFIER_LOG_LEVEL:-INFO}
      PRODUCT_VERIFIER_LOG_FORMAT: ${PRODUCT_VERIFIER_LOG_FORMAT:-json}
      PDV_PROVIDER_HEALTH_PATH: ${PDV_PROVIDER_HEALTH_PATH:-/data/provider_health.json}
      PDV_DISABLED_DISCOVERY_PROVIDERS: ${PDV_DISABLED_DISCOVERY_PROVIDERS:-duckduckgo_lite}
    volumes:
      - product-verifier-data:/data

volumes:
  product-verifier-data:
